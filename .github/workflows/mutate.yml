name: mutate

on:
  workflow_dispatch:
    inputs:
      target:
        description: config under mutation/, without .toml
        required: true
        type: choice
        options: [operators, basis, model, scripts]
      base:
        description: mutate only lines changed since this ref; empty mutates the whole target
        required: false
        default: ""
  pull_request:
    paths:
      - mutation/**
      - scripts/equivalent_mutants.py
      - .github/workflows/mutate.yml

jobs:
  mutate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ github.event_name == 'pull_request' && fromJSON('["operators", "basis", "model", "scripts"]') || fromJSON(format('["{0}"]', inputs.target)) }}
    timeout-minutes: 360
    env:
      XDG_CACHE_HOME: ${{ github.workspace }}/.mutation-cache
      BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || inputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: uv sync --locked --extra test --extra baselines
      - run: just host_memory_cap= mutate "${{ matrix.target }}" "$BASE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-${{ matrix.target }}
          path: ${{ env.XDG_CACHE_HOME }}/spectralsvr-mutation/${{ matrix.target }}.*
