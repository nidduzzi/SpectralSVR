name: check

on:
  push:
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: uv sync --locked --extra test --extra lint --extra baselines
      - run: just host_memory_cap= "test_workers=-n 4" check
